name: Train

# Fully automated Friday deploy train: merge green bot PRs, bump internal @chemistry/* deps
# direct-to-master, then dispatch deploy.yml (which chains e2e). Red run = the only alarm.
on:
  schedule:
    - cron: '7 21 * * 5'
  workflow_dispatch:
    inputs:
      bump_deps:
        description: 'Merge green dependabot PRs first (+ internal @chemistry/* bump)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  deps:
    name: Merge green dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # schedule always bumps deps; dispatch only when bump_deps=true
    if: github.event_name == 'schedule' || inputs.bump_deps
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Squash-merge dependabot PRs whose checks are green
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MERGED=0
          # Each bot PR was verified by pr-validation like any common PR; green = merge, red = leave open.
          PRS=$(gh pr list -R "$REPO" --author "app/dependabot" --state open --json number --jq '.[].number')
          if [ -z "$PRS" ]; then
            echo "No open dependabot PRs." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "merged=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "## Dependabot PRs" >> "$GITHUB_STEP_SUMMARY"
          for PR in $PRS; do
            SETTLED=false
            for i in $(seq 1 20); do
              OUT=$(gh pr checks "$PR" -R "$REPO" --json bucket 2>/dev/null || true); [ -z "$OUT" ] && OUT="[]"
              PENDING=$(echo "$OUT" | jq '[.[] | select(.bucket=="pending")] | length')
              [ "$PENDING" = "0" ] && { SETTLED=true; break; }
              echo "poll $i: PR #$PR has $PENDING pending check(s)"; sleep 30
            done
            OUT=$(gh pr checks "$PR" -R "$REPO" --json bucket 2>/dev/null || true); [ -z "$OUT" ] && OUT="[]"
            FAILED=$(echo "$OUT" | jq '[.[] | select(.bucket=="fail" or .bucket=="cancel")] | length')
            if [ "$SETTLED" = "true" ] && [ "$FAILED" = "0" ]; then
              if gh pr merge "$PR" -R "$REPO" --squash --delete-branch; then
                MERGED=$((MERGED+1)); echo "- #$PR merged" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- #$PR green but merge failed - left open" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "- #$PR left open (failed=$FAILED settled=$SETTLED)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"

  update:
    name: Bump internal deps + deploy
    needs: deps
    # run even when deps was skipped (manual, bump_deps=false)
    if: always() && needs.deps.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Sync to post-merge master
        run: git fetch origin master && git reset --hard origin/master && npm ci

      - name: Bump internal @chemistry/* deps
        id: ncu
        if: github.event_name == 'schedule' || inputs.bump_deps
        run: |
          set -euo pipefail
          FILES=$(git ls-files '*package.json')
          rm -rf /tmp/pre && for f in $FILES; do install -D "$f" "/tmp/pre/$f"; done
          # file:vendor/*.tgz deps are not registry specs - ncu leaves them alone
          npx --yes npm-check-updates -u --workspaces --root --dep prod,dev --filter '@chemistry/*'
          cat > /tmp/no-downgrade.mjs <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';

          const parts = (s) => (s.match(/\d+(?:\.\d+)*/)?.[0] ?? '0').split('.').map(Number);
          const isLower = (a, b) => {
            const [x, y] = [parts(a), parts(b)];
            for (let i = 0; i < 3; i++) {
              const d = (x[i] || 0) - (y[i] || 0);
              if (d !== 0) return d < 0;
            }
            return false;
          };
          const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

          for (const f of process.argv.slice(2)) {
            const pre = JSON.parse(readFileSync(`/tmp/pre/${f}`, 'utf8'));
            let text = readFileSync(f, 'utf8');
            const post = JSON.parse(text);
            for (const sec of ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']) {
              for (const [name, spec] of Object.entries(post[sec] ?? {})) {
                const old = pre[sec]?.[name];
                if (!old || old === spec || !isLower(spec, old)) continue;
                text = text.replace(new RegExp(`("${esc(name)}"\\s*:\\s*)"${esc(spec)}"`), `$1"${old}"`);
                console.log(`${f}: kept ${name} ${old} (rejected downgrade to ${spec})`);
              }
            }
            writeFileSync(f, text);
          }
          EOF
          node /tmp/no-downgrade.mjs $FILES
          npm install
          if git diff --quiet -- '*package.json' package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff -- '*package.json'
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate (mirrors pr-validation)
        id: validate
        if: steps.ncu.outputs.changed == 'true'
        run: |
          set +e
          npm run lint && npm run format:check && npm run build && npm run test && docker compose build
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            # a broken upstream major must not block the week's deploy
            echo "Internal bump reverted - checks red." | tee -a "$GITHUB_STEP_SUMMARY"
            git checkout -- $(git ls-files '*package.json') package-lock.json
            npm ci
            echo "reverted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit to master
        if: steps.ncu.outputs.changed == 'true' && steps.validate.outputs.reverted != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(deps): bump @chemistry/*"
          git pull --rebase origin master
          git push origin HEAD:master
          echo "Committed chore(deps): bump @chemistry/*" >> "$GITHUB_STEP_SUMMARY"

      - name: Check prod drift
        # root-only commits miss deploy.yml's path filter; a quiet week must still redeploy a stale prod
        id: drift
        run: |
          set -euo pipefail
          git pull --rebase --quiet origin master
          bash scripts/check-prod-drift.sh >> "$GITHUB_OUTPUT"

      - name: Dispatch deploy
        # GITHUB_TOKEN merges never fire the push-triggered deploy; deploy chains e2e
        if: >-
          (needs.deps.outputs.merged != '' && needs.deps.outputs.merged != '0') ||
          (steps.ncu.outputs.changed == 'true' && steps.validate.outputs.reverted != 'true') ||
          steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml -R "$REPO"
          sleep 15
          URL=$(gh run list -R "$REPO" --workflow deploy.yml --limit 1 --json url --jq '.[0].url' || true)
          echo "Deploy dispatched: ${URL:-see Actions tab}" >> "$GITHUB_STEP_SUMMARY"

      - name: Quiet week
        if: >-
          (needs.deps.outputs.merged == '' || needs.deps.outputs.merged == '0') &&
          (steps.ncu.outputs.changed != 'true' || steps.validate.outputs.reverted == 'true') &&
          steps.drift.outputs.drift != 'true'
        run: echo "Nothing to deploy - no bot PRs merged, no internal dep change landed, prod on-commit." >> "$GITHUB_STEP_SUMMARY"
