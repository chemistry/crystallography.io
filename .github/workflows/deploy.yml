name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'packages/containers/**'
      - 'docker-compose.yaml'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  STACK_NAME: crystallography-io
  REMOTE_DIR: /opt/crystallography.io
  OTEL_EXPORTER_OTLP_ENDPOINT: http://172.31.0.1:4318

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        env:
          COMMIT_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          docker compose build
          docker compose push

      - name: Generate .env file
        run: |
          cat > .env.production << EOF
          MONGO_INITDB_ROOT_USERNAME=root
          MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_PASSWORD }}
          MONGO_INITDB_HOST=mongo
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_HOST=rabbitmq
          RABBITMQ_PORT=5672
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          API_PORT=8070
          SEARCH_PORT=8050
          WEB_PORT=3000
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ env.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer%20${{ secrets.SIGNOZ_INGEST_TOKEN }}
          EOF
          sed -i 's/^          //' .env.production

      - name: Copy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yaml,.env.production
          target: ${{ env.REMOTE_DIR }}
          overwrite: true

      - name: Deploy to Docker Swarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          envs: REGISTRY,STACK_NAME,REMOTE_DIR
          script: |
            cd $REMOTE_DIR

            # Use generated .env
            mv -f .env.production .env
            chmod 600 .env

            # Authenticate with GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull all images before deploying
            docker compose pull

            # Deploy stack
            docker stack deploy -c docker-compose.yaml $STACK_NAME --with-registry-auth

            # Force update all services to pull latest images
            for service in $(docker stack services $STACK_NAME --format '{{.Name}}'); do
              docker service update --force "$service" 2>/dev/null || true
            done

            # Cleanup old unused images
            docker image prune -f

      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Verifying deployment..."
          EXPECTED="${{ github.sha }}"
          # Every HTTP surface bakes COMMIT_SHA into its v1 health envelope
          # (specs/health-endpoints.md): `version` = full sha, `commit` = 7-char.
          verify() {
            local name="$1" path="$2" live
            for i in $(seq 1 30); do
              live=$(curl -sfk --resolve "crystallography.io:443:${DEPLOY_HOST}" "https://crystallography.io${path}" 2>/dev/null | jq -r '.data.version // empty') || true
              if [ "$live" = "$EXPECTED" ]; then
                echo "PASS  ${name} ${path} serving ${live:0:8}"
                return 0
              fi
              echo "  attempt $i/30 ${name}: got ${live:-no response}, want ${EXPECTED:0:8}"
              sleep 10
            done
            echo "::error::FAIL  ${name} ${path} never served ${EXPECTED:0:8}"
            return 1
          }
          fail=0
          verify web /hc || fail=1
          verify api /api/health || fail=1
          verify searchrouter /api/v1/search/health || fail=1
          exit $fail

  e2e:
    needs: build-and-deploy
    uses: ./.github/workflows/e2e.yml
